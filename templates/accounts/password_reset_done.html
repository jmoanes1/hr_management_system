{% extends "base.html" %}

{% block auth_content %}
<div class="auth-page auth-page--centered">
    <div class="auth-panel-right">
        <div class="auth-card">
            <div class="auth-header">
                <div class="auth-logo">
                    {% include "includes/app_logo.html" with logo_static=True %}
                </div>
                <h1>Check your email</h1>
                <p>We've sent a password reset link to your registered email address. Please check your inbox. The link will expire in 60 minutes.</p>
            </div>
            <a href="{% url 'accounts:login' %}" class="btn btn-primary btn-block">Back to sign in</a>
        </div>
    </div>
</div>
{% endblock %}
