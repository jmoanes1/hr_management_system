{# App brand mark — sidebar, auth, and mobile header #}
{% if logo_static %}
<div class="app-logo{% if logo_compact %} app-logo--compact{% endif %}"{% if logo_aria_label %} aria-label="{{ logo_aria_label }}"{% endif %}>
{% else %}
<a href="{% if logo_href %}{{ logo_href }}{% else %}{% url 'dashboard:home' %}{% endif %}" class="app-logo{% if logo_compact %} app-logo--compact{% endif %}"{% if logo_aria_label %} aria-label="{{ logo_aria_label }}"{% endif %}>
{% endif %}
    <span class="app-logo-mark" aria-hidden="true">
        <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="9" y="6" width="16" height="20" rx="3"/>
            <path d="M6 8v16"/>
            <path d="M4.5 11H9M4.5 16H9M4.5 21H9"/>
            <circle cx="17" cy="12.5" r="2.25" fill="currentColor" stroke="none"/>
            <path d="M13 21c.4-2.7 1.8-4 4-4s3.6 1.3 4 4"/>
        </svg>
    </span>
    {% if not logo_compact %}
    <span class="app-logo-copy">
        <span class="app-logo-title">Employee Directory</span>
        <span class="app-logo-tagline">HR platform</span>
    </span>
    {% endif %}
{% if logo_static %}
</div>
{% else %}
</a>
{% endif %}
